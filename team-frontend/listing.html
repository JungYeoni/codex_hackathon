iew"><div class="listing-image"><div class="listing-phone"><i></i><span>14<br />PRO</span></div><div class="shine"></div></div><div><p class="preview-label">DEMO LISTING</p><h3>아이폰 14 Pro<br />256GB 딥퍼플</h3><p class="price">420,000원</p><span class="market-chip">당근마켓에서 가져온 캡처</span></div></div></div></article></div><div class="listing-actions"><button class="add-listing" id="addListing">＋ 비교할 매물 더 추가</button><button class="text-button" id="demoFill">예시 매물 정보 다시 불러오기</button></div><a class="primary-button page-next" id="analyzeButton" href="./analysis.html">매물 비교 분석하기 <span>↗</span></a></div></section></section><footer>살펴봄 · 중고 거래를 위한 개인 구매 판단 도우미</footer></main><div class="toast" id="toast" role="status"></div><script src="./app.js"></script></body></html>
